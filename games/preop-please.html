<!doctype html>
<!--
  Pre-Op, Please — UroStudyHub arcade game (a Papers, Please-style pre-op desk).
  You check tomorrow's cases: each patient's papers against a policy binder that grows by day,
  then CLEARED / DEFERRED / ESCALATE under a clock; Day 3 adds the pre-op antibiotic order.
  Standalone page: the app opens it in a frame with ?embed=1 and gets coins/XP back by postMessage
  ({type:'preop:claim', coins, xp} / {type:'preop:exit'}). Regression harness: tools/preop-please.drive.mjs.
  Params: ?day=1..3  ?daylen=SECONDS (default 240)  ?seed=N  ?debug (truth panel; ` toggles)  ?embed=1
  Keys:   N next · A clear · D defer · E escalate · Space / I inspect · Esc cancel
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141311">
<title>Pre-Op, Please</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1f1d1a;--booth:#39443a;--booth2:#2c352d;--desk:#5b4631;--desk2:#4c3a28;
  --paper:#efe6cf;--ink:#2a2622;--mute:#7a705f;--line:rgba(0,0,0,.18);
  --red:#b3261e;--green:#2e7d32;--amber:#b86e00;--sel:#f5c518;
  --t:#ece4d2;--tm:#b9ae98;
  --mono:"Special Elite","Courier New",ui-monospace,monospace;--pix:"VT323",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:14px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:268px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}

/* top bar */
#bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#141311;border-bottom:2px solid #000;flex-wrap:wrap}
.clock{font:32px/1 var(--pix);color:#f0d27a;letter-spacing:1px}
.date{font:22px/1 var(--pix);color:var(--tm)}
.pill{font:20px/1 var(--pix);padding:4px 9px;border-radius:6px;background:#2a2824}
.pill.bad{color:#f19a92}
.sp{flex:1}
.btn{font:600 14px/1 system-ui;padding:10px 14px;border-radius:10px;border:2px solid #000;background:#3b3833;color:var(--t);cursor:pointer}
.btn:active{transform:translateY(1px)}

/* booth */
#booth{background:linear-gradient(var(--booth),var(--booth2));padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;border-right:2px solid #000}
#window{position:relative;height:196px;flex:none;background:linear-gradient(#66705f,#4b5449 70%,#3a4139);border:3px solid #15170f;border-radius:6px;overflow:hidden}
#window:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#2a2620;border-top:2px solid #15170f}
#portrait{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);transition:transform .45s ease,opacity .45s ease}
#portrait.away-l{transform:translateX(-190%);opacity:0}
#portrait.away-r{transform:translateX(90%);opacity:0}
#nextBtn{position:absolute;inset:auto 12px 24px 12px;padding:16px 8px;font:700 20px/1 var(--mono);border-radius:10px;border:3px solid #15170f;background:#d9b44a;color:#2a1f00;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
#nextBtn[hidden]{display:none}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(217,180,74,.25)}}
#closed[hidden]{display:none}
#closed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 22px/1.2 var(--mono);color:#f3e3b5;text-align:center;background:rgba(0,0,0,.45)}
#monitor{background:#0b120c;color:#7cfc8a;font:21px/1.15 var(--pix);border:3px solid #15170f;border-radius:6px;padding:6px 10px;display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline}
#monitor[hidden]{display:none}
#monitor small{font:700 10px/1 system-ui;letter-spacing:.12em;color:#4f9a57;width:100%}
#monitor .f{color:#c9ffcb}
.speech{background:var(--paper);color:var(--ink);font:14px/1.35 var(--mono);padding:8px 10px;border-radius:8px;min-height:44px}
.speech .ln{margin:2px 0}.speech .ln.old{opacity:.5}.speech .sys{color:var(--mute);font-style:italic}
#fb{font:13px/1.3 system-ui;padding:7px 9px;border-radius:8px;min-height:20px;display:none}
#fb.hit{display:block;background:#5b1a15;color:#ffd9d4;border:1px solid #d9534f}
#fb.ok{display:block;background:#1d3b20;color:#d2f2d0;border:1px solid #4caf50}
#fb.none{display:block;background:#2b2b2b;color:#ccc;border:1px solid #555}
#found{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 12px/1.2 system-ui;padding:5px 8px;border-radius:999px;background:#f3d6d2;color:#6b1d17}
.chip.esc{background:#f7e2bd;color:#6b4100}
#stamps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stamp{font:700 17px/1 var(--mono);padding:16px 6px;border-radius:10px;border:3px solid;cursor:pointer;background:#f3ead5;letter-spacing:.04em}
.stamp.approve{color:var(--green);border-color:var(--green)}
.stamp.deny{color:var(--red);border-color:var(--red)}
.stamp.escalate{grid-column:1/-1;color:var(--amber);border-color:var(--amber)}
.stamp:disabled{opacity:.3;cursor:default}
.stamp[hidden]{display:none}
#slip{font:12.5px/1.4 var(--mono);border-radius:4px;padding:9px 10px;display:none}
#slip.good{display:block;background:#dfeedd;color:#173d19}
#slip.bad{display:block;background:#f6c8cf;color:#4a0d17;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:print .5s steps(6) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
#slip .ct{font:700 11px/1 system-ui;letter-spacing:.12em;margin-bottom:4px}
#slip ul{margin:4px 0 0;padding-left:16px}

/* desk */
#deskwrap{position:relative;min-height:0}
#desk{height:100%;overflow:auto;padding:12px 12px 80px;background:repeating-linear-gradient(90deg,var(--desk) 0 96px,var(--desk2) 96px 98px)}
#docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
.empty{grid-column:1/-1;text-align:center;color:rgba(255,240,210,.45);font:20px/1.3 var(--mono);padding:60px 10px}
.doc{background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 12px 12px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.25);font:13.5px/1.5 var(--mono);position:relative;animation:slidein .35s ease both}
.doc:nth-child(2){animation-delay:.05s}.doc:nth-child(3){animation-delay:.1s}.doc:nth-child(4){animation-delay:.15s}.doc:nth-child(5){animation-delay:.2s}.doc:nth-child(6){animation-delay:.25s}.doc:nth-child(7){animation-delay:.3s}
@keyframes slidein{from{transform:translateY(-18px) rotate(-2deg);opacity:0}}
.dh{font:700 11px/1 system-ui;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;align-items:baseline}
.lab{color:var(--mute);min-width:76px;flex:none;font-size:12px}
.mline{padding-left:2px}
.f{display:inline-block;max-width:100%;padding:1px 3px;border-radius:3px;cursor:pointer}
body.inspect .f,body.inspect .rule{outline:1.5px dashed rgba(179,38,30,.6);outline-offset:1px}
.f.sel,.rule.sel{background:var(--sel)!important;color:#000;outline:2px solid #000!important}
.f.hit,.rule.hit{background:#f3b1aa}
.d-id{background:#fbfbf6;border-left:12px solid #8fb3d9}
.d-book{background:#e3ecf3}.d-labs{background:#fbfaf3}.d-meds{background:#e4eedc}.d-consent{background:#f1e6cc}.d-img{background:#dde3ea}
.sig{font:20px/1 "Snell Roundhand","Brush Script MT","Segoe Script",cursive;color:#1d3a8a}
.blank{color:#999;letter-spacing:2px}
.sticky{position:absolute;right:-6px;top:-12px;background:#fde68a;color:#3b2f00;font:12px/1.25 var(--mono);padding:7px 9px;transform:rotate(4deg);box-shadow:0 3px 6px rgba(0,0,0,.3);max-width:150px;z-index:2}
.stampmark{position:absolute;right:14px;top:40px;font:700 24px/1 var(--mono);border:4px solid;padding:6px 10px;transform:rotate(-12deg);border-radius:6px;opacity:.88;animation:thunk .16s ease-out both;z-index:3;background:rgba(255,255,255,.25)}
.stampmark.approve{color:var(--green)}.stampmark.deny{color:var(--red)}.stampmark.escalate{color:var(--amber)}
@keyframes thunk{from{transform:rotate(-12deg) scale(1.8);opacity:0}}
.d-order{grid-column:1/-1;background:#fbf6e8;animation:none}
.microwrap{overflow-x:auto;margin:8px 0 4px}
table.micro{border-collapse:collapse;width:100%;font:13px/1.2 var(--mono)}
table.micro th,table.micro td{border:1px solid rgba(0,0,0,.18);text-align:center;padding:5px 2px;min-width:38px}
table.micro th{font:700 11px/1.1 system-ui;background:#ece3cc}
table.micro .org{text-align:left;min-width:120px;padding:5px 6px}
table.micro .org i{color:var(--mute);font-size:11px}
table.micro .sus{background:#d9ecd5;color:#1e5a22;font-weight:700}
table.micro .res{background:#f3d3cf;color:#7a1d16}
table.micro .ng{color:var(--mute)}
.pickrow td{background:#f6efdc}
.abxb{width:36px;height:36px;border-radius:8px;border:2px solid #2a2622;background:#fff;font:700 18px/1 system-ui;color:#1d3a8a;cursor:pointer;padding:0}
.abxb.on{background:#cfe0ff}
.abxb.none{width:auto;padding:0 12px;font:700 13px/1 var(--mono);color:var(--ink)}
.abxkey{font:11px/1.35 system-ui;color:var(--mute);margin:4px 0 8px}
.ordfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ordsel{flex:1;font:700 13px/1.3 var(--mono);min-width:120px}
.go.send{margin:0;padding:12px 18px;font-size:16px}
.go.send:disabled{opacity:.35;cursor:default}
#inspectBtn{position:absolute;right:14px;bottom:14px;font:700 17px/1 var(--mono);padding:16px 18px;border-radius:12px;border:3px solid #15170f;background:#e9dfc4;color:#2a1f00;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);z-index:5}
#inspectBtn.on{background:var(--sel)}

/* binder */
#binder{background:#6b201b;padding:10px;overflow:auto;border-left:2px solid #000}
#binder h2{font:700 12px/1 system-ui;letter-spacing:.14em;color:#f3d9c9;margin:4px 2px 10px;display:flex;justify-content:space-between}
.rule{background:var(--paper);color:var(--ink);border-radius:4px;padding:9px 10px;margin-bottom:8px;font:12.5px/1.42 var(--mono);cursor:pointer;position:relative}
.rule .rt{font:700 13px/1.2 system-ui;margin-bottom:4px;padding-right:34px}
.rule .rid{display:inline-block;background:var(--ink);color:var(--paper);font:700 11px/1 system-ui;padding:3px 5px;border-radius:4px;margin-right:6px}
.rule .new{position:absolute;right:8px;top:8px;background:var(--red);color:#fff;font:700 10px/1 system-ui;padding:3px 5px;border-radius:3px}

/* overlays */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov[hidden]{display:none}
.paper{background:var(--paper);color:var(--ink);max-width:760px;width:100%;border-radius:4px;padding:22px 24px;font:14px/1.5 var(--mono);box-shadow:0 10px 40px rgba(0,0,0,.6);max-height:calc(100dvh - 32px);overflow:auto;-webkit-user-select:text;user-select:text}
.mast{font:700 38px/1 Georgia,"Times New Roman",serif;text-align:center;letter-spacing:.02em}
.masts{text-align:center;font:12px/1.2 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:5px 0;margin:8px 0 12px}
.headline{font:700 25px/1.12 Georgia,serif;margin:6px 0 6px;text-transform:uppercase}
.sub{font:italic 15px/1.3 Georgia,serif;color:#4a4338;margin-bottom:12px}
.box{border:2px solid var(--ink);padding:10px 12px;margin:12px 0}
.box h3{margin:0 0 6px;font:700 13px/1 system-ui;letter-spacing:.12em}
.box .r{margin:5px 0}
.go.alt{background:#e9dfc4;font-size:15px;padding:11px 18px}
#exitBtn[hidden]{display:none}
.go{display:block;margin:16px auto 0;font:700 18px/1 var(--mono);padding:14px 22px;border-radius:10px;border:3px solid var(--ink);background:#d9b44a;color:#2a1f00;cursor:pointer}
table.recap{width:100%;border-collapse:collapse;font:12.5px/1.35 var(--mono)}
table.recap td{border-bottom:1px dashed var(--line);padding:5px 4px;vertical-align:top}
table.recap .why{color:#6b1d17;font-size:12px;padding-top:0}
table.recap .why.half{color:#6b4a00}
.ledger .l{display:flex;justify-content:space-between;padding:3px 0}
.ledger .l.tot{border-top:2px solid var(--ink);font-weight:700;margin-top:4px;padding-top:6px}
.ledger label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ledger input{width:20px;height:20px}
#lines{position:fixed;inset:0;pointer-events:none;z-index:15;transition:opacity .4s}
#dbg{position:fixed;left:8px;bottom:8px;z-index:30;background:rgba(0,0,0,.88);color:#9f9;font:11px/1.35 ui-monospace,monospace;padding:8px 10px;max-width:440px;border-radius:6px;white-space:pre-wrap;pointer-events:none}
#dbg[hidden]{display:none}

@media (max-width:1000px){
  html,body{overflow:auto;height:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto;height:auto;padding-bottom:150px}
  #booth{border-right:0;display:grid;grid-template-columns:150px 1fr;align-items:start}
  #window{height:170px;grid-row:span 4}
  #stamps{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#141311;border-top:2px solid #000;grid-template-columns:1fr 1fr 1fr}
  .stamp.escalate{grid-column:auto}
  #slip{grid-column:1/-1}
  #desk{height:auto;overflow:visible;padding-bottom:16px}
  #inspectBtn{position:fixed;bottom:86px;right:12px}
  #binder{border-left:0}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <span class="clock" id="clock">08:00</span>
    <span class="date"><span id="dayname">MON</span> <span class="f" data-f="desk.date" id="deskdate">11/02/26</span></span>
    <span class="pill" id="dayPill">DAY 1</span>
    <span class="sp"></span>
    <span class="pill" id="earnPill">TODAY $0</span>
    <span class="pill" id="citePill">CITATIONS 0</span>
    <span class="pill" id="savePill">SAVINGS $0</span>
    <button class="btn" id="musicBtn" title="Music on/off">🎵 Music</button>
    <button class="btn" id="pauseBtn" title="Pause">⏸</button>
    <button class="btn" id="exitBtn" title="Back to UroStudyHub" hidden>✕</button>
  </header>

  <section id="booth">
    <div id="window">
      <div id="portrait" class="away-l"></div>
      <button id="nextBtn">📢 NEXT!</button>
      <div id="closed" hidden>17:00<br>DESK CLOSED</div>
    </div>
    <div id="monitor" hidden></div>
    <!-- stamps above every growing text block, so a new speech line never slides them out from under a thumb -->
    <div id="stamps">
      <button class="stamp approve" data-v="approve" disabled>CLEARED</button>
      <button class="stamp deny" data-v="deny" disabled>DEFERRED</button>
      <button class="stamp escalate" data-v="escalate" disabled hidden>ESCALATE → ED</button>
    </div>
    <div class="speech" id="speech"></div>
    <div id="fb"></div>
    <div id="found"></div>
    <div id="slip"></div>
  </section>

  <section id="deskwrap">
    <div id="desk"><div id="docs"></div></div>
    <button id="inspectBtn">🔍 INSPECT</button>
  </section>

  <aside id="binder"></aside>
</div>
<svg id="lines"></svg>
<div id="ov" hidden><div class="paper" id="ovp"></div></div>
<div id="dbg" hidden></div>

<script>
'use strict';
// ── params, rng, dates ─────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const SEED = Q.has('seed') ? (+Q.get('seed') | 0) : (Math.random() * 1e9 | 0);
const DAYLEN = Math.max(20, +Q.get('daylen') || 240) * 1000;
const START_DAY = Math.min(3, Math.max(1, +Q.get('day') || 1));
const PAY = 40, FINE = 30, FREE_WARN = 2, LAST_DAY = 3, SHIFT_MIN = 540, MISS_COST = 5;
const LOANS = 120, DAYCARE = 80, TAKEOUT = 40;

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(SEED);
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;
function wpick(items) { const tot = items.reduce((s, x) => s + x.w, 0); let r = R() * tot; for (const x of items) { if ((r -= x.w) < 0) return x; } return items[items.length - 1]; }

const DAYMS = 864e5, DAY0 = Date.UTC(2026, 10, 1);   // Day 1 = Mon 11/02/26 (UTC math — Nov 1 is a DST day)
const today = d => DAY0 + d * DAYMS;
const pad = n => String(n).padStart(2, '0');
const fmt = t => { const x = new Date(t); return pad(x.getUTCMonth() + 1) + '/' + pad(x.getUTCDate()) + '/' + String(x.getUTCFullYear()).slice(2); };
const fmtDob = t => { const x = new Date(t); return pad(x.getUTCMonth() + 1) + '/' + pad(x.getUTCDate()) + '/' + x.getUTCFullYear(); };
const daysAgo = (t, d) => Math.round((today(d) - t) / DAYMS);
const dayName = d => ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][new Date(today(d)).getUTCDay()];
function ageOn(dob, t) { const a = new Date(dob), b = new Date(t); let y = b.getUTCFullYear() - a.getUTCFullYear(); if (b.getUTCMonth() < a.getUTCMonth() || (b.getUTCMonth() === a.getUTCMonth() && b.getUTCDate() < a.getUTCDate())) y--; return y; }
const dobFor = (age, d) => Math.floor(today(d) / DAYMS - age * 365.25 - ri(5, 355)) * DAYMS;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const $ = s => document.querySelector(s);

// ── content ────────────────────────────────────────────────────────
const MFIRST = ['James', 'Robert', 'Luis', 'Wei', 'Marcus', 'Daniel', 'Ahmed', 'Tomasz', 'Kenji', 'DeShawn', 'Raj', 'Paul', 'Victor', 'Samuel', 'Hector', 'Ivan', 'Omar', 'Frank', 'Leon', 'Arthur', 'Bernard', 'Kwame'];
const FFIRST = ['Maria', 'Linda', 'Aisha', 'Mei', 'Patricia', 'Sofia', 'Grace', 'Fatima', 'Elena', 'Keisha', 'Priya', 'Hannah', 'Rosa', 'Yuki', 'Olivia', 'Nadia', 'Carmen', 'Ruth', 'Jasmine', 'Ingrid', 'Beatriz', 'Leah'];
const LAST = ['Okafor', 'Nguyen', 'Kowalski', 'Hernandez', 'Patel', 'Johnson', 'Schmidt', 'Rossi', 'Kim', 'Haddad', 'Brooks', 'Moreau', 'Lindqvist', 'Castillo', 'Tanaka', 'Abernathy', 'Mbeki', 'Fischer', 'Delgado', 'Chen', 'Walsh', 'Novak', 'Reyes', 'Sato', 'Bauer', 'Farouk', 'Marchetti', 'Osei'];
const ORGS = ['E. coli', 'K. pneumoniae', 'E. faecalis', 'P. mirabilis', 'P. aeruginosa'];
const ORG_BUG = { 'E. coli': 'ecoli', 'K. pneumoniae': 'kleb', 'E. faecalis': 'efae', 'P. mirabilis': 'prot', 'P. aeruginosa': 'pae' };
// Day 3 antibiotic order. Columns narrow → broad; 🔒 = needs ID approval. S/R strings follow ABX order.
const ABX = [['cfz', 'Cefazolin (Ancef)', 1], ['amp', 'Ampicillin', 1], ['gen', 'Gentamicin', 2], ['cro', 'Ceftriaxone', 2], ['cip', 'Ciprofloxacin', 3],
  ['fep', 'Cefepime', 4], ['tzp', 'Pip-tazo', 4], ['etp', 'Ertapenem', 5, true], ['mem', 'Meropenem', 5, true]].map(([k, n, tier, id]) => ({ k, n, tier, id: !!id, ab: k.toUpperCase() }));
const ABXK = {}; ABX.forEach(a => { ABXK[a.k] = a; });
const BUGS = { ecoli: { n: 'E. coli', s: 'SRSSSSSSS' }, ecoliR: { n: 'E. coli', s: 'RRSSRSSSS' }, esbl: { n: 'E. coli (ESBL)', s: 'RRSRRRRSS' }, esblG: { n: 'E. coli (ESBL)', s: 'RRRRRRRSS' },
  kleb: { n: 'K. pneumoniae', s: 'SRSSSSSSS' }, prot: { n: 'P. mirabilis', s: 'SSSSSSSSS' }, efae: { n: 'E. faecalis', s: 'RSRRRRSRR' }, pae: { n: 'P. aeruginosa', s: 'RRSRSSSRS' }, paeMdr: { n: 'P. aeruginosa', s: 'RRRRRRRRS' } };

function next() {

}
function stamp(v) {

  toggleInspect(false); sfx('stamp');
  const book = document.querySelector('.d-book');
  if (book) { const m = document.createElement('div'); m.className = 'stampmark ' + v; m.textContent = v === 'approve' ? 'CLEARED' : v === 'deny' ? 'DEFERRED' : '→ ED'; book.appendChild(m); }
  if (v === 'approve' && G.day >= 3) {   // R8: a cleared case needs its antibiotic order before it goes back
    G.ordering = true; G.order = []; G.orderNone = false; renderBooth();

}
function sendOrder() {

function finalize(v, order) {

  const res = { ok, v };
  if (ok) {
    res.half = v === 'deny' && !cited; res.pay = res.half ? PAY / 2 : PAY; S.income += res.pay;
    if (res.half) res.missed = T.vio.map(x => `[${x.rule}] ${x.explain}`);
  } else {
    res.cite = ab && !ab.ok ? { kind: ab.kind, title: 'Wrong pre-op antibiotic', lines: ab.lines.map(l => '[R8] ' + l) } : citationFor(v, T); S.cites++;
    if (S.cites > FREE_WARN) { S.fines += FINE; res.fine = FINE; } else res.warn = S.cites;
  }
  S.log.push({ name: p.name, proc: p.P.short, v, correct: T.verdict, ok, half: res.half, cite: res.cite, missed: res.missed, abx: ab && !ab.ok, order: order ? abxName(order) : null });
  if (p.script === 'gerald' && G.day === 3 && v === 'approve') { say('GLORY TO UROLOGY!'); setMood('happy'); }
  else if (v === 'approve') { say(pick(['Thank you, doctor.', 'Finally!', 'See you on the other side.'])); setMood('happy'); }
  else if (v === 'escalate') say(ok ? 'The ER? ...Okay. I do feel terrible.' : 'The ER?! For what?');
  else say(ok ? pick(['Fine. I\'ll fix it and come back.', 'Again?!', '...Okay.']) : pick(['But everything was in order!', 'You\'re sending me home? Why?']));
  showResult(res); renderBar();
  setTimeout(() => { G.booth = 'leaving'; renderBooth(); }, 650);
  setTimeout(() => { G.cur = null; G.booth = 'empty'; renderBooth(); renderDocs(); }, 1150);
}
// coins / XP for the app: full calls, half for an uncited deferral; capped so a long session can't flood the economy
function rewardsSoFar() {
  const logs = G.hist.reduce((a, h) => a.concat(h.stats.log), []), full = logs.filter(l => l.ok && !l.half).length, half = logs.filter(l => l.half).length;
  return { coins: Math.min(150, full * 3 + half), xp: Math.min(80, full * 2 + half), full, half, n: logs.length };
}
function claim() {
  if (!EMBED || G.claimed) return; G.claimed = true;
  const r = rewardsSoFar(); window.parent.postMessage({ type: 'preop:claim', coins: r.coins, xp: r.xp }, location.origin);
}
function citationFor(v, T) {
  const reasons = T.vio.map(x => `[${x.rule}] ${x.explain}`), notes = T.her.map(h => `[${h.rule}] ${h.note}`);
  if (T.verdict === 'escalate') return { kind: 'sepsis-' + v, title: v === 'approve' ? 'Cleared lithotripsy on an infected, obstructed kidney' : 'Sent an infected, obstructed kidney home', lines: T.vio.filter(x => x.escalate).map(x => `[R7] ${x.explain}`) };

      <div class="l"><span>Home</span><span id="lgHome"></span></div></div>
    <table class="recap">${rows || '<tr><td>No patients seen.</td></tr>'}</table>
    <button class="go" id="homeBtn">${G.day < LAST_DAY ? 'Go home →' : 'Finish the trial →'}</button>
    ${EMBED && G.day < LAST_DAY ? '<button class="go alt" id="claimBtn">Claim rewards & leave</button>' : ''}`);
  const calc = () => {
    const dc = $('#lgDay').checked, tk = $('#lgFood').checked;
    let home = G.home - (dc ? 0 : 1) + (tk ? 1 : 0) - (S.cites >= 3 ? 1 : 0); home = Math.max(0, Math.min(3, home));
    return { tot: G.savings + S.income - S.fines - LOANS - (dc ? DAYCARE : 0) - (tk ? TAKEOUT : 0), home };
  };
  const upd = () => { const c = calc(); $('#lgTot').textContent = (c.tot < 0 ? '−$' : '$') + Math.abs(c.tot); $('#lgHome').textContent = HOME[c.home]; };
  $('#lgDay').onchange = upd; $('#lgFood').onchange = upd; upd();
  $('#homeBtn').onclick = () => { const c = calc(); G.savings = c.tot; G.home = c.home; if (G.day < LAST_DAY) { G.day++; renderBar(); showBulletin(); } else showFinal(); };
  if ($('#claimBtn')) $('#claimBtn').onclick = claim;
}
const HOME = ['😞 Nobody waited up', '😐 Tense dinner', '🙂 Fine', '😊 Happy home'];
function showFinal() {
  G.state = 'final';
  const tot = G.hist.reduce((a, h) => ({ n: a.n + h.stats.log.length, ok: a.ok + h.stats.log.filter(l => l.ok && !l.half).length, half: a.half + h.stats.log.filter(l => l.half).length, c: a.c + h.stats.cites }), { n: 0, ok: 0, half: 0, c: 0 });
  const acc = tot.n ? Math.round(100 * (tot.ok + tot.half) / tot.n) : 0;

  overlay(`<div class="mast" style="font-size:30px">Trial Complete</div><div class="masts">Three days at the procedure desk</div>
    <div class="box"><div class="r">Patients: <b>${tot.n}</b> · correct calls: <b>${acc}%</b> (${tot.half} without a logged reason)</div>
    <div class="r">Citations: <b>${tot.c}</b> · Savings: <b>${G.savings < 0 ? '−$' : '$'}${Math.abs(G.savings)}</b> · Home: <b>${HOME[G.home]}</b></div></div>
    <div class="sub">${end}</div>
    ${G.hist.map(h => `<div class="r">Day ${h.day}: ${h.stats.log.filter(l => l.ok).length}/${h.stats.log.length} · ${h.stats.cites} citation(s)</div>`).join('')}
    ${EMBED ? `<button class="go" id="claimBtn">Claim ${rewardsSoFar().coins} 💰 + ${rewardsSoFar().xp} XP</button>` : ''}
    <button class="go${EMBED ? ' alt' : ''}" id="againBtn">Play again — new patients</button>`);
  if ($('#claimBtn')) $('#claimBtn').onclick = claim;
  $('#againBtn').onclick = () => { const u = new URL(location.href); u.searchParams.delete('seed'); u.searchParams.delete('day'); location.href = u.toString(); };
}

// ── clock ──────────────────────────────────────────────────────────
let lastT = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(now - lastT, 2000); lastT = now;
  if (G.state !== 'shift' || G.paused) return;
  G.clock = Math.min(SHIFT_MIN, G.clock + dt * SHIFT_MIN / DAYLEN);
  if (G.clock >= SHIFT_MIN && !G.closing) { G.closing = true; say('17:00 — last patient, then the desk closes.', 'sys'); renderBooth(); if (G.booth === 'empty') renderDocs(); }   // never re-render a live desk: it replays the paper slide-in mid-inspection
  if (G.closing && G.booth === 'empty') endDay();
  renderBar();
}, 100);

// ── audio (unlocks on first touch) ─────────────────────────────────
let ACX = null;
function audio() { try { if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)(); if (ACX.state === 'suspended') ACX.resume(); } catch (e) {} return ACX; }
function tone(f, dur, type = 'square', vol = .06, when = 0) { const a = ACX; if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02); }
function noise(dur, vol = .3, freq = 300, when = 0) { const a = ACX; if (!a) return; const b = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + when); }
const SFX = { stamp: () => { noise(.12, .9, 220); tone(70, .16, 'sine', .3); }, next: () => { tone(392, .12, 'square', .05); tone(330, .18, 'square', .05, .13); },
  hit: () => { tone(880, .08, 'square', .05); tone(660, .14, 'square', .05, .09); }, ok: () => { tone(660, .08, 'sine', .07); tone(990, .12, 'sine', .07, .08); },
  none: () => tone(170, .14, 'triangle', .08), cite: () => { for (let i = 0; i < 9; i++) noise(.02, .3, 4500, i * .045); } };
function sfx(k) { try { if (ACX && SFX[k]) SFX[k](); } catch (e) {} }

// ── music: an ORIGINAL procedural loop (🎵 toggles) — slow D-minor oom-pah march, accordion chords,
// sparse lead, in the Papers, Please mood. It beat a swung "kitchen" loop in an A/B playtest.
// The melody's first phrase drops out every other loop so the repetition breathes.
const MOODS = ['booth', 'off'], MUSIC_VOL = .42;
const CH = { Dm: [50, [62, 65, 69]], Gm: [55, [62, 67, 70]], A7: [57, [61, 64, 67]], Bb: [58, [62, 65, 70]], F: [53, [60, 65, 69]], C: [48, [60, 64, 67]] };   // [bass root, chord] as MIDI notes
const TRACKS = {
  booth: { bpm: 92, lead: 'lead', rest: [4, 5, 6, 7],
    form: ['Dm', 'Gm', 'A7', 'Dm', 'Dm', 'Gm', 'A7', 'Dm', 'Bb', 'Gm', 'A7', 'Dm', 'F', 'C', 'A7', 'Dm'],
    mel: { 4: [[0, 69, 2], [2, 69, 1], [3, 70, 1], [4, 69, 2], [6, 65, 2]], 5: [[0, 67, 3], [3, 65, 1], [4, 62, 4]], 6: [[0, 64, 2], [2, 61, 1], [3, 64, 1], [4, 69, 2], [6, 67, 2]], 7: [[0, 65, 2], [2, 64, 2], [4, 62, 4]],
      8: [[0, 70, 2], [2, 69, 2], [4, 70, 1], [5, 72, 1], [6, 74, 2]], 9: [[0, 74, 3], [3, 72, 1], [4, 70, 2], [6, 67, 2]], 10: [[0, 69, 2], [2, 67, 1], [3, 64, 1], [4, 61, 2], [6, 64, 2]], 11: [[0, 62, 6]] } },
};
let VA = null, VO = null;   // audio target for the voices of the step being scheduled (live context or an offline render)
const MUS = { mood: (() => { try { return localStorage.getItem('pp_music') === 'off' ? 'off' : 'booth'; } catch (e) { return 'booth'; } })(), ctx: null, bus: null, timer: null, step: 0, next: 0, loop: 0 };
const NOISE = new WeakMap();
function noiseBuf(a) { let b = NOISE.get(a); if (!b) { b = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; NOISE.set(a, b); } return b; }
function voice(kind, midi, t, dur, vel = 1) {
  const a = VA, f = 440 * Math.pow(2, (midi - 69) / 12), g = a.createGain(), end = t + dur + .5;
  g.gain.value = 0; g.connect(VO);
  const env = (att, peak, rel) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak * vel, t + att); g.gain.setTargetAtTime(0, t + Math.max(att, dur - rel), rel / 3); };
  const filt = (type, fr) => { const b = a.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.connect(g); return b; };
  const osc = (type, fr, det, dest) => { const o = a.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = det || 0; o.connect(dest || g); o.start(t); o.stop(end); return o; };
  const vib = (o, rate, cents) => { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = rate; lg.gain.value = cents; l.connect(lg).connect(o.detune); l.start(t); l.stop(end); };
  const hiss = (type, fr, peak, len) => { const s = a.createBufferSource(); s.buffer = noiseBuf(a); s.connect(filt(type, fr)); g.gain.setValueAtTime(peak * vel, t); g.gain.exponentialRampToValueAtTime(.0001, t + len); s.start(t, Math.random() * .8, len + .02); };
  if (kind === 'bass') { env(.01, .16, .12); osc('triangle', f); }
  else if (kind === 'reed') { env(.02, .022, .08); const lp = filt('lowpass', 1100); osc('sawtooth', f, -7, lp); osc('sawtooth', f, 7, lp); }
  else if (kind === 'lead') { env(.03, .045, .1); vib(osc('square', f, 0, filt('lowpass', 1700)), 5, 7); }
  else if (kind === 'brush') hiss('bandpass', 1800, .03, .06);
}
function playStep(T, s, t, spb, loop, a, out) {
  VA = a; VO = out;
  const bar = Math.floor(s / 8), st = s % 8, [root, notes] = CH[T.form[bar]], tt = t;
  if (st === 0) voice('bass', root, tt, spb * 1.8);           // oom
  if (st === 4) voice('bass', root - 5, tt, spb * 1.8);
  if (st === 2 || st === 6) { notes.forEach(n => voice('reed', n, tt, spb * .9)); voice('brush', 0, tt, .06); }   // pah
  const mel = !(loop % 2 && T.rest.includes(bar)) && T.mel[bar];
  if (mel) mel.forEach(([ms, n, len]) => { if (ms === st) voice(T.lead, n, tt, len * spb); });
}
function musicTick() {
  const a = MUS.ctx, T = TRACKS[MUS.mood]; if (!a || !T) return;
  const spb = 60 / T.bpm / 2, total = T.form.length * 8;
  if (MUS.next < a.currentTime) MUS.next = a.currentTime + .05;   // tab was throttled: skip ahead, never pile notes up
  while (MUS.next < a.currentTime + .4) { playStep(T, MUS.step, MUS.next, spb, MUS.loop, a, MUS.bus); MUS.next += spb; if (++MUS.step >= total) { MUS.step = 0; MUS.loop++; } }
}
function musicLevel(v, secs) { if (!MUS.bus) return; const a = MUS.ctx; MUS.bus.gain.cancelScheduledValues(a.currentTime); MUS.bus.gain.setValueAtTime(MUS.bus.gain.value, a.currentTime); MUS.bus.gain.linearRampToValueAtTime(v, a.currentTime + secs); }
function musicStart() {
  const a = audio(); if (!a || MUS.timer || !TRACKS[MUS.mood]) return;
  if (!MUS.bus) { MUS.bus = a.createGain(); MUS.bus.gain.value = 0; const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; MUS.bus.connect(lp).connect(a.destination); }
  MUS.ctx = a; MUS.step = 0; MUS.loop = 0; MUS.next = a.currentTime + .15;
  musicLevel(G.paused ? 0 : MUSIC_VOL, 1.5);
  MUS.timer = setInterval(musicTick, 60); musicTick();
}
function musicStop() { if (!MUS.timer) return; clearInterval(MUS.timer); MUS.timer = null; musicLevel(0, .3); }
function musicSet(m) { MUS.mood = m; try { localStorage.setItem('pp_music', m); } catch (e) {} musicStop(); if (m !== 'off') musicStart(); renderMusicBtn(); }
function renderMusicBtn() { $('#musicBtn').textContent = MUS.mood === 'off' ? '🔇 Music' : '🎵 Music'; }
// Prototype check: render the loop offline and report loudness next to the stamp SFX (music must sit well under it).
async function musicLevels(secs = 24) {
  const meter = buf => { const d = buf.getChannelData(0); let pk = 0, sq = 0; for (let i = 0; i < d.length; i++) { const x = d[i]; if (Math.abs(x) > pk) pk = Math.abs(x); sq += x * x; } return { peak: +pk.toFixed(3), rmsDb: +(10 * Math.log10(sq / d.length + 1e-12)).toFixed(1) }; };
  const out = {}, sr = 22050;
  for (const m of ['booth']) {
    const oc = new OfflineAudioContext(1, sr * secs, sr), bus = oc.createGain(); bus.gain.value = MUSIC_VOL; bus.connect(oc.destination);
    const T = TRACKS[m], spb = 60 / T.bpm / 2; let t = .05, s = 0, loop = 0;
    while (t < secs - 1) { playStep(T, s, t, spb, loop, oc, bus); t += spb; if (++s >= T.form.length * 8) { s = 0; loop++; } }
    out[m] = { ...meter(await oc.startRendering()), loopSecs: +(T.form.length * 8 * spb).toFixed(1) };
  }
  const oc = new OfflineAudioContext(1, sr, sr), keep = ACX; ACX = oc; SFX.stamp(); ACX = keep;
  out.stampSfx = meter(await oc.startRendering());

}
document.addEventListener('pointerdown', () => { audio(); if (MUS.mood !== 'off' && !MUS.timer) musicStart(); }, { passive: true });

// ── input ──────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const st = e.target.closest('.stamp'); if (st) { stamp(st.dataset.v); return; }
  const ab = e.target.closest('[data-abx]'); if (ab) { toggleAbx(ab.dataset.abx); return; }
  if (e.target.closest('#sendOrder')) { sendOrder(); return; }
  const f = e.target.closest('[data-f]'); if (f) onPick(f);
});
$('#nextBtn').onclick = next;
$('#inspectBtn').onclick = e => { e.stopPropagation(); if (G.booth === 'present') toggleInspect(); };
$('#pauseBtn').onclick = () => { if (G.state !== 'shift') return; G.paused = !G.paused; renderBar(); musicLevel(G.paused ? 0 : MUSIC_VOL, .4); if (G.paused) { overlay('<div class="mast" style="font-size:30px">Paused</div><button class="go" id="resumeBtn">Resume</button>'); $('#resumeBtn').onclick = () => { G.paused = false; $('#ov').hidden = true; renderBar(); musicLevel(MUSIC_VOL, .8); }; } };
$('#musicBtn').onclick = () => musicSet(MOODS[(MOODS.indexOf(MUS.mood) + 1) % MOODS.length]);
$('#exitBtn').hidden = !EMBED;
$('#exitBtn').onclick = () => { musicStop(); window.parent.postMessage({ type: 'preop:exit' }, location.origin); };
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n') next(); else if (k === 'a') stamp('approve'); else if (k === 'd') stamp('deny'); else if (k === 'e') stamp('escalate');
  else if (k === ' ' || k === 'i') { e.preventDefault(); if (G.booth === 'present') toggleInspect(); }
  else if (k === 'escape') toggleInspect(false);
  else if (k === '`') { G.debug = !G.debug; renderDebug(); }
});

// ── debug / test hooks (PROTOTYPE) ─────────────────────────────────
function selfTest(n = 300) {
  const out = {}, problems = [], box = document.createElement('div'), abxMix = {}; let abxN = 0;
  box.style.cssText = 'position:absolute;left:-9999px;top:0;width:600px'; document.body.appendChild(box);
  for (let d = 1; d <= 3; d++) {
    const cnt = { approve: 0, deny: 0, escalate: 0 }, tags = {}, pats = [];
    for (let i = 0; i < n; i++) pats.push(genRandom(d));
    Object.values(SCRIPT[d]).forEach(fn => pats.push(finish(fn(d))));
    for (const p of pats) {
      cnt[p.truth.verdict]++; p.tags.forEach(t => { tags[t] = (tags[t] || 0) + 1; });
      box.innerHTML = docsHTML(p) + (d >= 3 ? monitorHTML(p) : '') + '<span data-f="desk.date"></span>' + RULES.map(r => `<span data-f="rule.${r.id}"></span>`).join('');
      const have = new Set([...box.querySelectorAll('[data-f]')].map(e => e.dataset.f));
      const tag = p.tags.join(',') || 'script:' + p.name;
      p.truth.vio.forEach(v => {
        if (!v.withRule.length) problems.push(`d${d} ${tag}: uncitable ${v.kind}`);
        [...v.pairs.flat(), ...v.withRule].forEach(f => { if (!have.has(f)) problems.push(`d${d} ${tag}: violation field ${f} not rendered`); });
        if (RULES.find(r => r.id === v.rule).day > d) problems.push(`d${d} ${tag}: inactive rule ${v.rule} fired`);
      });
      p.truth.her.forEach(h => h.fields.forEach(f => { if (!have.has(f)) problems.push(`d${d} ${tag}: herring field ${f} not rendered`); }));
      const flaw = p.tags.find(t => !t.startsWith('~')), herring = p.tags.find(t => t.startsWith('~'));
      if (flaw && p.truth.verdict === 'approve') problems.push(`d${d} flaw ${flaw} evaluated clean`);
      if (flaw === 'septic' && p.truth.verdict !== 'escalate') problems.push(`d${d} septic not escalate`);
      if (herring && p.truth.verdict !== 'approve') problems.push(`d${d} herring ${herring} → ${p.truth.verdict} (${p.truth.vio.map(v => v.kind)})`);
      if (!p.tags.length && !p.expect && p.truth.verdict !== 'approve') problems.push(`d${d} untagged → ${p.truth.verdict} (${p.truth.vio.map(v => v.kind)})`);
      if (p.expect && p.truth.verdict !== p.expect) problems.push(`d${d} script ${p.name} expected ${p.expect} got ${p.truth.verdict}`);
      if (d >= 3 && p.truth.verdict === 'approve') {
        const plan = abxPlan(p); abxN++;
        if (!plan.sets.length) problems.push(`d3 ${tag}: no antibiotic plan`);
        plan.sets.forEach(x => { if (!plan.bugs.every(b => x.some(k => covers(b, k)))) problems.push(`d3 ${tag}: plan misses a bug`); });
        if (!abxJudge(p, plan.sets[0]).ok) problems.push(`d3 ${tag}: canonical order judged wrong`);
        const wrong = plan.sets[0].length ? [] : ['cfz'], wj = abxJudge(p, wrong);
        if (plan.sets.some(x => x.join() === wrong.join())) { /* "none" or cefazolin both fine for TP biopsy */ } else if (wj.ok || !wj.lines.length) problems.push(`d3 ${tag}: a wrong order passed`);
        if (p.expectAbx && plan.sets[0].join('+') !== p.expectAbx.join('+')) problems.push(`d3 script ${p.name} abx ${plan.sets[0]} ≠ ${p.expectAbx}`);
        const kind = plan.bugs.length ? (plan.sets[0].some(k => ABXK[k].id) ? 'restricted' : plan.sets[0].length > 1 ? 'combo' : 'single') : 'standard:' + plan.sets[0].join('+');
        abxMix[kind] = (abxMix[kind] || 0) + 1;
      }
    }
    out['day' + d] = { ...cnt, tags };
  }
  box.remove();
  out.abx = { n: abxN, mix: abxMix };
  return { out, problems: [...new Set(problems)].slice(0, 40), nProblems: problems.length };
}
window.__pp = { G, MUS, musicSet, musicLevels, next, stamp, sendOrder, toggleAbx, abxPlan, abxJudge, rewardsSoFar, EMBED, judge: (a, b) => judge({ f: a, el: fieldEl(a) }, { f: b, el: fieldEl(b) }), pick: f => onPick(fieldEl(f)), toggleInspect, selfTest, endShift: () => { G.clock = SHIFT_MIN; }, evaluate, genRandom, SEED };

renderBinder(); renderBar(); renderBooth(); renderDocs(); renderMusicBtn(); showBulletin();
</script>
