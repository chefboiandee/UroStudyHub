<!doctype html>
<!--
  Uro Rush — UroStudyHub arcade game. One shift that switches between outpatient clinic and the inpatient
  consult pager at random (it replaces the old separate Uro Clinic Rush + Inpatient Consults React games).
  Walk the doctor into a room, read the chart, order the right first step before the patient gives up.
  Clinic and consults have different order sets, so you have to know both.
  Standalone page: the app opens it in a frame with ?embed=1 and gets coins/XP back by postMessage
  ({type:'rush:claim', coins, xp} / {type:'rush:exit'}). Harness: tools/uro-rush.drive.mjs.
  Params: ?seed=N  ?debug (shows the keyed answer on the chart)  ?touch (force the touch UI)  ?embed=1
  Keys:   WASD / arrows walk · 1-9 0 - = order · P / Esc pause · M mute · Enter / Space continue
  Touch:  drag anywhere on the map: a joystick appears under the thumb (it follows if you drag past the rim).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1118">
<title>Uro Rush</title>
<style>
:root{--bg:#0b121a;--bar:#0a1118;--panel:#121c27;--ink:#e8eef5;--mute:#8ea2b6;--line:#223142;--acc:#38bdf8;--accbg:rgba(56,189,248,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,31vw,380px);grid-template-rows:auto minmax(0,1fr);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* top bar */
#hud{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
#modeChip{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--accbg);border:1px solid var(--acc);color:var(--acc);font-weight:800;letter-spacing:.08em;font-size:13px;white-space:nowrap;transition:background .3s,border-color .3s,color .3s}
#modeChip span{font-size:17px}
.hs{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap}
.hs small{font-size:9px;letter-spacing:.14em;color:var(--mute);font-weight:800}
.hs b{font-size:19px;font-variant-numeric:tabular-nums}
#streak{color:#fbbf24;font-weight:900;font-size:15px;white-space:nowrap}
#pendHud{display:flex;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
#pendHud span{padding:3px 8px;border-radius:8px;background:#172638;border:1px solid var(--line)}
#pendHud .q{color:#fbbf24;border-color:#7c5a12}
#blocks{display:flex;gap:4px}
#blocks i{font-style:normal;width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#132030;border:1px solid var(--line);color:var(--mute);font-weight:800}
#blocks i.done{opacity:.4}
#blocks i.cur{border-color:var(--acc);background:var(--accbg)}
#hearts{font-size:18px;letter-spacing:1px;color:#f43f5e;white-space:nowrap}
#hearts .lost{color:#2b394a}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#142030;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.sp{flex:1}

/* map */
#stage{position:relative;overflow:hidden;touch-action:none;min-height:0;min-width:0;background:var(--bg)}
#stage:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.38) 100%)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#joyBase{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.04) 70%);pointer-events:none;z-index:3;display:none;box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.3)}
#joyBase.show{display:block}
#joyBase.idle{opacity:.45}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 60%,#8696aa);box-shadow:0 3px 8px rgba(0,0,0,.45)}
#joyHint{position:absolute;left:50%;top:100%;margin-top:8px;transform:translateX(-50%);font:800 10px/1 system-ui;letter-spacing:.14em;color:rgba(255,255,255,.75);white-space:nowrap;text-shadow:0 1px 2px #000}
#joyBase:not(.idle) #joyHint{display:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-6px);z-index:4;pointer-events:none;padding:7px 14px;border-radius:12px;background:rgba(8,14,20,.9);border:1.5px solid currentColor;font-weight:800;font-size:15px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* chart + orders */
#panel{display:flex;flex-direction:column;gap:8px;padding:12px 10px 10px;background:var(--panel);border-left:1px solid var(--line);min-height:0;min-width:0}
#chart{position:relative;background:#f6f1e7;color:#1f2933;border-radius:12px;padding:12px 12px 10px;min-height:136px;box-shadow:0 3px 0 rgba(0,0,0,.4);overflow:hidden;flex:none}
#chart:before{content:"";position:absolute;left:50%;top:0;width:58px;height:8px;margin-left:-29px;border-radius:0 0 6px 6px;background:#7b8794}
#chart.flash-ok{animation:fok .5s}
#chart.flash-bad{animation:fbad .5s}
@keyframes fok{0%{box-shadow:0 0 0 4px #4ade80}100%{box-shadow:0 3px 0 rgba(0,0,0,.4)}}
@keyframes fbad{0%{box-shadow:0 0 0 4px #f87171}100%{box-shadow:0 3px 0 rgba(0,0,0,.4)}}
.ch-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#52606d}
.ch-top .room{color:#0f172a;font-size:13px}
.loc{padding:1px 7px;border-radius:6px;font-size:11px;background:#e2e8f0;color:#334155}
.loc.ED{background:#fed7aa;color:#7c2d12}.loc.ICU{background:#fecaca;color:#7f1d1d}.loc.FLOOR{background:#bbf7d0;color:#14532d}.loc.EXAM{background:#bae6fd;color:#0c4a6e}
.bar{display:block;height:6px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden;margin:7px 0 8px}
.bar i{display:block;height:100%;width:100%;background:#22c55e;border-radius:4px}
.cc{font-size:18px;font-weight:650;line-height:1.3}
.who{display:inline-block;padding:0 6px;margin-right:6px;border-radius:6px;background:#1f2933;color:#f6f1e7;font-weight:800;font-size:15px}
.dbg{margin-top:6px;font:700 11px ui-monospace,monospace;color:#b45309}
.hint{font-size:13px;color:#52606d;font-weight:650;margin-bottom:7px}
.census{display:flex;flex-direction:column;gap:6px}
.census.empty{font-size:13px;color:#7b8794;font-style:italic}
.cz{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;font-size:12.5px;align-items:baseline}
.cz b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#0f172a}
.cz span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155}
.cz .bar{grid-column:1/-1;margin:2px 0 0;height:4px}
#ordHead{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--mute);padding:0 2px}
#ordHead b{color:var(--acc)}
#orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(36px,60px);align-content:start;gap:6px;flex:1;min-height:0}
#orders.off .ord{opacity:.4}
.ord{position:relative;display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:11px;border:1px solid #2a3a4d;border-left:5px solid var(--c);background:linear-gradient(180deg,#1a2838,#142131);color:var(--ink);text-align:left;font-weight:700;font-size:14px;line-height:1.15;box-shadow:0 2px 0 rgba(0,0,0,.45);touch-action:manipulation;min-width:0}
.ord .ic{font-size:20px;flex:none}
.ord .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ord .sn{display:none}
.ord kbd{position:absolute;right:6px;top:4px;font:700 10px ui-monospace,monospace;color:var(--mute)}
.ord.down{transform:translateY(2px);box-shadow:none;background:var(--c);color:#08111a}
.ord.nope{animation:nope .3s}
.ord.pend{background:var(--c);color:#08111a;box-shadow:0 0 0 2px #fff inset}
.ord.pend:after{content:"📝";position:absolute;right:5px;bottom:2px;font-size:12px}
.pendline{margin-top:7px;padding:5px 8px;border-radius:8px;background:#dbeafe;color:#1e3a8a;font-size:12.5px;font-weight:700}
.comp .row{display:flex;gap:6px;align-items:baseline;font-size:12.5px;margin-top:3px}
.comp .row b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#0f172a;min-width:44px}
.comp .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155}
.comp .res.ok{color:#15803d}.comp .res.bad{color:#b91c1c}
.qz b{color:#92400e}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* overlay cards */
#scr{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(5,9,14,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#scr.on{display:flex}
.card{width:100%;max-width:540px;max-height:100%;overflow:auto;background:#121c27;border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.55);text-align:center;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.card h1{margin:4px 0 2px;font-size:34px;letter-spacing:-.01em}
.card h2{margin:2px 0 6px;font-size:26px}
.card .sub{margin:0 0 12px;color:var(--mute);font-size:15px}
.logo{font-size:40px;display:flex;justify-content:center;align-items:center;gap:10px}
.logo .swap{font-size:22px;color:var(--mute)}
.how{list-style:none;margin:10px 0 14px;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px}
.how li{background:#182533;border-radius:10px;padding:8px 11px;font-size:14px;color:#cfd9e3}
.how li b{color:#fff}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.big{padding:14px 28px;border-radius:12px;border:0;background:var(--acc);color:#06121c;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.alt{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:#182533;font-weight:700}
.big:active,.alt:active{transform:translateY(2px)}
.tiny{font-size:12px;color:var(--mute);margin-top:8px}
.pager{width:184px;margin:4px auto 14px;padding:12px;border-radius:16px;background:linear-gradient(#3d4452,#222833);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 8px 18px rgba(0,0,0,.5);animation:buzz .12s linear 12}
.pager .lcd{background:#a3c58f;color:#13210e;font:700 15px/1.3 ui-monospace,Menlo,monospace;border-radius:6px;padding:8px 6px;letter-spacing:.06em;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.pager .lcd span{animation:blink 1s steps(1) infinite}
.pager .btn3{display:flex;justify-content:center;gap:8px;margin-top:8px}.pager .btn3 i{width:22px;height:8px;border-radius:4px;background:#525b6b}
@keyframes buzz{0%{transform:none}25%{transform:translate(-2px,1px) rotate(-1.5deg)}50%{transform:translate(1px,-1px) rotate(1deg)}75%{transform:translate(2px,1px) rotate(1.5deg)}}
@keyframes blink{50%{opacity:0}}
.csign{display:inline-block;margin:8px auto 16px;padding:12px 22px;border-radius:12px;background:#f6f1e7;color:#0f172a;font-weight:900;letter-spacing:.14em;font-size:18px;border:4px solid #38bdf8;transform-origin:50% -30px;animation:swing 1.8s ease-out;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.csign small{display:block;font-size:11px;letter-spacing:.2em;color:#0369a1}
@keyframes swing{0%{transform:rotate(14deg)}25%{transform:rotate(-9deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}100%{transform:none}}
.newacts{margin:6px 0 4px}
.newacts .lbl{display:block;font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--acc);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:5px;margin:3px;padding:5px 9px;border-radius:9px;background:#182533;border-left:4px solid var(--c);font-weight:700;font-size:13px}
.score{font-size:46px;font-weight:900;color:#fbbf24;line-height:1}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.stats span{background:#182533;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
.reward{font-weight:900;font-size:17px;margin:6px 0}
.misses{text-align:left;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.misses .lbl{font-size:10px;letter-spacing:.18em;font-weight:900;color:#f87171}
.miss{display:flex;gap:9px;background:#182533;border-radius:10px;padding:8px 10px;font-size:13px}
.miss .mi{font-size:17px}
.miss .mcc{color:#e8eef5;font-weight:650}
.miss .mans{color:var(--mute);margin-top:2px}
.miss .mans b{color:#4ade80}

/* portrait (phones, iPad upright): map on top, chart + orders underneath */
@media (max-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #panel{border-left:0;border-top:1px solid var(--line);padding:10px 10px 8px}
  #chart{min-height:118px}
  #orders{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:54px;flex:none;gap:5px}
  .ord{flex-direction:column;justify-content:center;gap:1px;text-align:center;padding:3px 3px 3px 1px;font-size:11.5px;line-height:1.1;border-left-width:4px}
  .ord .ic{font-size:18px}
  .ord .nm,.ord .sn{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ord .nm{display:none}
  #ordHead{display:none}
}
@media (max-aspect-ratio:1/1) and (min-width:700px){ .ord .nm{display:-webkit-box} .ord .sn{display:none} #orders{grid-auto-rows:62px} .ord{font-size:14px} .ord .ic{font-size:21px} .cc{font-size:20px} #ordHead{display:flex} }
@media (max-aspect-ratio:1/1) and (max-height:740px){ #chart{min-height:96px;padding:10px 10px 8px} .cc{font-size:15px} .who{font-size:13px} .bar{margin:5px 0 6px} #orders{grid-auto-rows:48px} }
/* phone landscape: everything tighter */
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #hud{padding:4px 10px;gap:9px} .hs b{font-size:15px} .ib{width:32px;height:32px} #hearts{font-size:15px} #modeChip{padding:3px 10px 3px 7px}
  #panel{padding:8px 6px 6px;gap:5px} #chart{min-height:0;padding:9px 9px 7px} .cc{font-size:14px} .who{font-size:12px} .bar{margin:4px 0 5px}
  #orders{gap:4px;grid-auto-rows:minmax(26px,46px)} .ord{font-size:12px;padding:2px 6px;gap:5px} .ord .ic{font-size:15px}
  #ordHead{display:none}
}
@media (max-width:560px){ #blocks{display:none} #muteBtn{display:none} }
@media (max-width:400px){ .hs small{display:none} #hud{gap:8px} #modeChip b{display:none} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="modeChip"><span id="modeIcon">🏥</span><b id="modeName">CLINIC</b></div>
    <div class="hs"><small>SCORE</small><b id="score">0</b></div>
    <div id="streak"></div>
    <div id="pendHud"></div>
    <div class="sp"></div>
    <div id="blocks"></div>
    <div id="hearts"></div>
    <div class="hs" id="progWrap"><small>PATIENTS</small><b id="prog">0/0</b></div>
    <button class="ib" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="ib" id="pauseBtn" aria-label="Pause">⏸</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="joyBase"><div id="joyKnob"></div><div id="joyHint">DRAG TO WALK</div></div>
    <div id="toast"></div>
  </div>
  <aside id="panel">
    <div id="chart"></div>
    <div id="ordHead"><span>FIRST STEP</span><b id="ordMode"></b></div>
    <div id="orders"></div>
  </aside>
</div>
<div id="scr"></div>
<script>
'use strict';
// ── setup ──────────────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const EMBED = Q.has('embed') && window.parent !== window;   // hosted inside UroStudyHub's arcade
const DEBUG = Q.has('debug');
const TOUCH = Q.has('touch') || ('ontouchstart' in window) || !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SEED = Q.has('seed') ? (parseInt(Q.get('seed'), 10) || 1) : ((Math.random() * 1e9) | 0);
let rnd = mulberry32(SEED), vrnd = mulberry32(SEED ^ 0x5bd1e995);   // gameplay / looks (looks never shift the gameplay stream)
const ri = n => Math.floor(rnd() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const vpick = a => a[Math.floor(vrnd() * a.length)];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ── content ────────────────────────────────────────────────────────
// ans = the keyed first step; alt = other answers that are also right (full credit, the toast names the best one).
// diff = the tier the case appears from; its answer's order unlocks at that tier or earlier.
const CLINIC_CASES = [
  // tier 1: UA / PSA / CT / US
  { cc: '22F, dysuria, frequency, urgency x2 days', ans: 'ua', diff: 1 },
  { cc: '58M, LUTS, weak stream, nocturia x3', ans: 'psa', alt: ['ua'], diff: 1 },
  { cc: '45M, acute flank pain radiating to groin, N/V', ans: 'ct', diff: 1 },
  { cc: '25M, painless testicular mass, firm', ans: 'us', diff: 1 },
  { cc: '55F, recurrent UTIs (4/yr), no anatomic issues', ans: 'ua', diff: 1 },
  { cc: '30F, microscopic hematuria, no risk factors', ans: 'ua', diff: 1 },
  { cc: '35M, painless scrotal swelling, testis not palpable', ans: 'us', diff: 1 },
  { cc: '60M, nocturia x5, AUA-SI score 22', ans: 'psa', alt: ['ua'], diff: 1 },
  // tier 2: + cystoscopy, biopsy, Foley, send to ED (what an office can't handle: CBI, urgent decompression, torsion)
  { cc: '65M, painless gross hematuria, 40 pk-yr smoker', ans: 'cysto', alt: ['ct'], diff: 2 },
  { cc: '70M, hard prostatic nodule on referral note', ans: 'bx', diff: 2 },
  { cc: '62M, PSA 4.2 last yr, now 8.1, soft prostate', ans: 'bx', alt: ['psa'], diff: 2 },
  { cc: '68M, PSA 12, PI-RADS 5 lesion on MRI', ans: 'bx', diff: 2 },
  { cc: '50M, elevated Cr + bilateral hydro on US', ans: 'foley', diff: 2 },
  { cc: '80M, urinary retention, BPH, Cr rising', ans: 'foley', diff: 2 },
  { cc: '72M, gross hematuria + clot retention', ans: 'ed', diff: 2 },
  { cc: '38M, R ureteral stone on CT, hydro, fever 102', ans: 'ed', diff: 2 },
  { cc: '14M, sudden L scrotal pain 2 hrs, high-riding testis', ans: 'ed', diff: 2 },
  { cc: '60M, BCG-unresponsive CIS of the bladder, follow-up', ans: 'cysto', diff: 2 },
  { cc: "78M, AUR, can't void, suprapubic distension", ans: 'foley', diff: 2 },
  // tier 3: + urodynamics, semen analysis
  { cc: '29M, spinal cord injury, neurogenic bladder, rising PVR', ans: 'uds', diff: 3 },
  { cc: '52F, SUI back after a sling, planning redo surgery', ans: 'uds', diff: 3 },
  { cc: '28M, infertility, small soft testes, low T', ans: 'sa', diff: 3 },
  { cc: '32M, 1 yr trying to conceive, partner work-up normal', ans: 'sa', diff: 3 },

      () => { on('resBtn', togglePause); on('sndBtn', () => { toggleMute(); $('sndBtn').textContent = 'Sound: ' + (AUD.muted ? 'Off' : 'On'); }); on('rstBtn', () => { hideScr(); startShift(); }); on('exitBtn', exitGame); });
  } else if (G.state === 'paused') { hideScr(); G.state = 'play'; }
}
function showOver() {
  joyReset();
  const r = rewards(), by = m => { const l = G.log.filter(x => x.mode === m); return [l.filter(x => x.kind === 'ok').length, l.length]; };
  const c = by('clinic'), k = by('consult');
  const miss = G.log.filter(x => x.kind !== 'ok');
  const missHtml = miss.length ? '<div class="misses"><span class="lbl">REVIEW · ' + miss.length + ' MISSED</span>' + miss.map(x => {
    const best = actOf(x.mode, x.ans), you = x.chose ? actOf(x.mode, x.chose) : null, alts = x.alt.map(id => actOf(x.mode, id).name);
    return '<div class="miss"><span class="mi">' + MODES[x.mode].icon + '</span><div><div class="mcc">' + esc(x.cc) + '</div><div class="mans">' + (you ? 'You: ' + you.icon + ' ' + esc(you.name) : 'Ran out of time') + ' → <b>' + best.icon + ' ' + esc(best.name) + '</b>' + (alts.length ? ' (or ' + esc(alts.join(', ')) + ')' : '') + '</div></div></div>';
  }).join('') + '</div>' : '<div class="tiny">No misses. Clean shift. 👏</div>';
  showScr('<h2>' + (G.done ? (miss.length ? '🌙 Shift complete' : '🏆 Perfect shift') : '💔 Sent home early') + '</h2>'
    + '<div class="score">' + G.score + '</div><div class="tiny">' + (G.newBest ? 'New best!' : 'Best: ' + G.best) + '</div>'
    + '<div class="stats"><span>🏥 Clinic ' + c[0] + '/' + c[1] + '</span><span>📟 Consults ' + k[0] + '/' + k[1] + '</span><span>🔥 Best streak ' + G.bestStreak + '</span></div>'
    + (EMBED ? '<div class="reward">+' + r.coins + ' 💰 · +' + r.xp + ' XP</div>' : '')
    + missHtml
    + '<div class="btns">' + (EMBED ? '<button class="big" id="claimBtn">Claim ▸</button>' : '') + '<button class="' + (EMBED ? 'alt' : 'big') + '" id="againBtn">Play again</button>' + (EMBED ? '<button class="alt" id="exitBtn">Back to arcade</button>' : '') + '</div>'
    + (EMBED ? '' : '<div class="tiny">Coins and XP are claimed when you play from the UroStudyHub arcade.</div>'),
    () => { on('claimBtn', () => { claim(); $('claimBtn').disabled = true; $('claimBtn').textContent = 'Claimed ✓'; }); on('againBtn', () => { hideScr(); startShift(); }); on('exitBtn', exitGame); });
}

// ── input ─────────────────────────────────────────────────────────
const joyBase = $('joyBase'), knob = $('joyKnob'), R_JOY = 56;
function placeJoy() {
  const show = joy.on || (TOUCH && G.state === 'play');
  joyBase.classList.toggle('show', show); joyBase.classList.toggle('idle', !joy.on);
  if (joy.on) { joyBase.style.left = joy.ox + 'px'; joyBase.style.top = joy.oy + 'px'; }
  else {
    const roomy = VIEW.thumb > 110;
    joyBase.style.left = Math.max(74, VIEW.w * (roomy ? .22 : .13)) + 'px';
    joyBase.style.top = (roomy ? VIEW.h - VIEW.thumb / 2 - 8 : VIEW.h - Math.max(74, VIEW.h * .16)) + 'px';
    knob.style.transform = '';
  }
}
function joyReset() { joy.id = null; joy.on = false; joy.vx = joy.vy = 0; placeJoy(); }
stage.addEventListener('pointerdown', e => {
  if (joy.id !== null || G.state !== 'play') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  joy.id = e.pointerId; try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const r = stage.getBoundingClientRect(); joy.ox = e.clientX - r.left; joy.oy = e.clientY - r.top; joy.on = true; joy.vx = joy.vy = 0;
  placeJoy(); e.preventDefault(); audioInit();
});
stage.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let dx = px - joy.ox, dy = py - joy.oy, m = Math.hypot(dx, dy);
  const lim = R_JOY * 1.3;
  if (m > lim) { const f = (m - lim) / m; joy.ox += dx * f; joy.oy += dy * f; dx = px - joy.ox; dy = py - joy.oy; m = lim; }   // the base follows the thumb
  const cm = Math.min(m, R_JOY), ux = m ? dx / m : 0, uy = m ? dy / m : 0;
  let mag = cm / R_JOY; mag = mag < .12 ? 0 : (mag - .12) / .88;
  joy.vx = ux * mag; joy.vy = uy * mag;
  knob.style.transform = 'translate(' + (ux * cm) + 'px,' + (uy * cm) + 'px)';
  placeJoy();
});
const joyEnd = e => { if (e.pointerId !== joy.id) return; joyReset(); };
stage.addEventListener('pointerup', joyEnd); stage.addEventListener('pointercancel', joyEnd); stage.addEventListener('lostpointercapture', joyEnd);
const KMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
addEventListener('keydown', e => {
  audioInit();
  if (KMAP[e.code]) { keys[KMAP[e.code]] = true; e.preventDefault(); return; }
  if (G.state === 'play') { const ix = KEYS.indexOf(e.key); if (ix >= 0) { const a = visActs()[ix]; if (a) order(a.id); e.preventDefault(); return; } }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); e.preventDefault(); }
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'Enter' || e.code === 'Space') {
    if (G.state === 'card') { contCard(); e.preventDefault(); }
    else if (G.state === 'title') { startShift(); e.preventDefault(); }
  }
});
addEventListener('keyup', e => { if (KMAP[e.code]) keys[KMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && G.state === 'play') togglePause(); });
document.addEventListener('gesturestart', e => e.preventDefault());
$('pauseBtn').addEventListener('click', togglePause);
$('muteBtn').addEventListener('click', toggleMute);

// ── sound (synthesized, no files) ─────────────────────────────────
const AUD = { ctx: null, master: null, muted: store.get('uroRush_mute') === '1' };
function audioInit() {
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume().catch(() => {}); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try { AUD.ctx = new C(); AUD.master = AUD.ctx.createGain(); AUD.master.gain.value = AUD.muted ? 0 : .6; AUD.master.connect(AUD.ctx.destination); } catch (e) { AUD.ctx = null; }
}
function toggleMute() { AUD.muted = !AUD.muted; store.set('uroRush_mute', AUD.muted ? '1' : '0'); if (AUD.master) AUD.master.gain.value = AUD.muted ? 0 : .6; updateHud(); }
function tone(f, at, dur, o) {
  const c = AUD.ctx; if (!c || AUD.muted) return; o = o || {};
  const t0 = c.currentTime + (at || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0); if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(o.vol || .15, t0 + (o.att || .008)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g); g.connect(AUD.master); osc.start(t0); osc.stop(t0 + dur + .05);
}
const sfx = {
  arrive() { if (G.mode === 'consult') { tone(1318, 0, .08, { type: 'square', vol: .04 }); tone(1318, .13, .08, { type: 'square', vol: .04 }); } else { tone(784, 0, .4, { vol: .1 }); tone(587, .17, .55, { vol: .1 }); } },
  ok(n) { const b = 523.25 * Math.pow(2, Math.min(n, 9) / 24); [0, 4, 7, 12].forEach((s, k) => tone(b * Math.pow(2, s / 12), k * .055, .22, { type: 'triangle', vol: .12 })); },
  bad() { tone(196, 0, .3, { type: 'sawtooth', vol: .07, to: 104 }); tone(185, .02, .3, { type: 'square', vol: .04, to: 98 }); },
  timeout() { tone(392, 0, .55, { type: 'triangle', vol: .11, to: 140 }); },
  urgent() { tone(988, 0, .06, { type: 'square', vol: .03 }); tone(988, .1, .06, { type: 'square', vol: .03 }); },
  pager() { for (let k = 0; k < 6; k++) tone(k % 2 ? 1760 : 2093, k * .12, .1, { type: 'square', vol: .045 }); },
  bell() { tone(880, 0, 1.1, { vol: .11 }); tone(1318, 0, .7, { vol: .04 }); tone(659, .26, 1.2, { vol: .1 }); },
  pend() { tone(880, 0, .05, { type: 'triangle', vol: .07 }); tone(1175, .05, .06, { type: 'triangle', vol: .06 }); },
  key() { tone(1400 + Math.random() * 300, 0, .025, { type: 'square', vol: .025 }); tone(1600, .07, .025, { type: 'square', vol: .02 }); },
  queued() { tone(523, 0, .14, { type: 'sine', vol: .06 }); tone(440, .12, .2, { type: 'sine', vol: .06 }); },
  fanfare() { [0, 4, 7, 12].forEach((s, k) => tone(440 * Math.pow(2, s / 12), k * .09, .32, { type: 'triangle', vol: .11 })); },
};

// ── self-test (content invariants; the harness runs it) ───────────
function selfTest() {
  const problems = [];
  Object.keys(MODES).forEach(m => {
    const M = MODES[m];
    M.cases.forEach(c => {
      const a = actOf(m, c.ans);
      if (!a) problems.push(m + ': no action ' + c.ans + ' for ' + c.cc);
      else if (a.wave > c.diff) problems.push(m + ': ' + c.ans + ' unlocks at tier ' + a.wave + ' but the case shows at ' + c.diff + ': ' + c.cc);
      (c.alt || []).forEach(id => { if (!actOf(m, id)) problems.push(m + ': no alt action ' + id); if (id === c.ans) problems.push(m + ': alt repeats ans'); });
      if (m === 'consult' && !c.p.loc) problems.push('consult without ED/Floor/ICU: ' + c.cc);
    });
    [1, 2, 3].forEach(t => { if (!M.cases.some(c => c.diff === t)) problems.push(m + ': no tier ' + t + ' cases'); });
    if (M.acts.length > KEYS.length) problems.push(m + ': more orders than keys');
  });
  return problems;
}

// ── loop ──────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!G.frozen) {
    if (G.state === 'play') update(dt);
    else if (G.state !== 'paused') fx(dt);
  }
  render(); renderPanel();
  if (TOUCH && !joy.on) placeJoy();
  requestAnimationFrame(frame);
}
// test hooks for tools/uro-rush.drive.mjs
window.__rush = {
  G, MODES, LAYOUTS, SEED, EMBED, TOUCH, selfTest, rewards, claim, order, activeRoom, startShift, contCard, togglePause, visActs,
  freeze(v) { G.frozen = v !== false; },
  step(sec, h) { h = h || 1 / 60; for (let t = 0; t < sec - 1e-9; t += h) { if (G.state === 'play') update(h); } render(); renderPanel(); return G.state; },
  teleport(i) { const r = G.L.rooms[i]; Object.assign(G.doc, { x: r.x + r.w / 2 + 40, y: r.back === 'N' ? r.bed.y + r.bed.h + 34 : r.bed.y - 34, vx: 0, vy: 0 }); },
  occupied() { return G.rooms.map((r, i) => r.pat ? i : -1).filter(i => i >= 0); },
  answer(i) { const p = G.rooms[i] && G.rooms[i].pat; return p ? p.c.ans : null; },
  wrongFor(i) { const p = G.rooms[i].pat; return visActs().find(a => a.id !== p.c.ans && (p.c.alt || []).indexOf(a.id) < 0).id; },
  setJoy(x, y) { G.autoJoy = x == null ? null : { x, y }; },
  _view() { return VIEW; },
  undecided() { return G.rooms.map((r, i) => r.pat && !r.pat.pend ? i : -1).filter(i => i >= 0); },
  pended: () => pendedRooms(),
  atComputer: () => atComputer(),
  toComputer() { Object.assign(G.doc, { x: G.L.computer.x, y: G.L.computer.y, vx: 0, vy: 0 }); },
  signAll() { this.toComputer(); let g = 0; while (pendedRooms().length && G.state === 'play' && g++ < 400) this.step(.05); return pendedRooms().length === 0; },
  put(i, match) {   // seat a specific case (substring of its cc) in room i of the current setting
    const c = MODES[G.mode].cases.find(x => x.cc.indexOf(match) >= 0); if (!c) return false;
    G.rooms[i].pat = { c, max: PATIENCE[G.tier - 1], left: PATIENCE[G.tier - 1], t0: G.time, look: lookFor(c), id: ++G.pid, warned: false }; return true;
  },
  forceBlock(mode, tier) { G.blocks[G.bi + 1] = { mode, n: 6, tier }; G.blocks[G.bi].n = G.blockSpawned; G.rooms.forEach(r => { r.pat = null; }); G.queue = []; nextBlock(); },
};
layoutView();
updateHud();
showTitle();
requestAnimationFrame(frame);
</script>
