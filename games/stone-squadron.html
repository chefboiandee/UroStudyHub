<style>

#laserPanel{position:absolute;right:calc(env(safe-area-inset-right) + 160px);bottom:calc(env(safe-area-inset-bottom) + 256px);width:226px;pointer-events:auto;padding:8px 10px;transition:transform .2s ease,opacity .2s ease;transform-origin:bottom right}

.sets{display:grid;gap:10px}

.prep{width:min(1060px,100%)}
#comms{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 106px);transform:translate(-50%,12px);width:min(460px,46vw);display:flex;gap:10px;align-items:center;padding:7px 12px 7px 7px;border-radius:14px;background:rgba(6,10,22,.84);border:1px solid var(--cc,#60a5fa);box-shadow:0 0 18px rgba(0,0,0,.6);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none}

  c.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; const dy = e.clientY - drag.y; if (Math.abs(dy) > 6) drag.moved = true; if (drag.moved) { const ni = clamp(drag.i + Math.round(dy / 5), 0, SLICES - 1); if (ni !== CTV.idx) { CTV.idx = ni; drawCT(); } } });
  c.addEventListener('pointerup', e => { if (!drag || e.pointerId !== drag.id) return; if (!drag.moved) { const r = c.getBoundingClientRect(); ctTap((e.clientX - r.left) / r.width * 360, (e.clientY - r.top) / r.height * 360); } drag = null; });
  c.addEventListener('pointercancel', () => { drag = null; });
  c.addEventListener('wheel', e => { e.preventDefault(); step(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  $('scrubBtn').addEventListener('click', () => { if (G.prep.abx) startPlay(); });
  $('prepBack').addEventListener('click', showBrief);
  drawCT();
}
function startPlay() {
  audioInit();
  const fx = ABX_FX[abxVerdict()[0]]; G.sepK = fx.k; G.sepsis = fx.s0; commsReset();
  if (!EMBED) try { const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen; const r = fs && fs.call(d); if (r && r.catch) r.catch(() => {}); } catch (_) {}
  hideScreen();
  $('hud').classList.remove('hidden');
  if (useTouch) $('touch').classList.remove('hidden');
  camMode = SETTINGS.cam === 'scope' ? 'scope' : 'chase';
  const fpv = camMode === 'scope';
  $('scopeMask').classList.toggle('hidden', !fpv);
  scope.visible = !fpv; fpFiber.visible = fpTip.visible = fpv;
  camera.fov = fpv ? 78 : 68; camera.updateProjectionMatrix(); updateScale();
  aimBeam.visible = aimDot.visible = hitGlow.visible = true; closeLaserPanel();
  renderMode();
  // snap camera behind the scope
  frameAt(Math.max(0, G.p.s - 5.2), F2); camera.position.copy(F2.p).addScaledVector(F2.u, 1.2);
  frameAt(G.p.s + 7, F3); camLook.copy(F3.p);
  const warm = [basket, bkLine, beamCore, beamGlow, ...rings.map(r => r.m)];
  const dummies = Object.keys(MAT_FRAG).map(k => { const m = new THREE.Mesh(FRAG_GEOS[k][0], MAT_FRAG[k]); worldAt(G.p.s + 3, 0, 0, m.position); m.scale.setScalar(0.001); scene.add(m); return m; });
  for (const o of warm) o.visible = true;

  state = 'play'; fpsReset(); document.body.classList.add('ingame');

  toast('Line up the green aiming beam on the stone, then fire', '', 'hint1', 0);
}
function quiet() { for (const g of [AU.buzz, AU.crack, AU.scrape, AU.flow]) level(g, 0); input.fire = input.pa = input.pb = input.back = false; }
function showPause() {
  closeLaserPanel();

    <div class="sets" style="margin-top:14px">
      <div class="set"><span>DEFLECTION</span>${segHTML('invert', [[false, 'Standard'], [true, 'Inverted']])}</div>
      <div class="set"><span>CAMERA</span>${segHTML('cam', [['scope', 'Scope view'], ['chase', 'Chase cam']])}</div>
      <div class="set"><span>OR CHATTER</span>${segHTML('chatter', [[true, 'On'], [false, 'Off']])}</div>
    </div>
    <p class="keys">Graphics: ${Q.bloom ? 'bloom on' : 'bloom off'} · ${Q.pr.toFixed(2)}× resolution</p>
    <div class="go"><button id="resBtn">RESUME</button><button class="alt" id="gfxBtn">${Q.bloom ? 'Bloom off' : 'Bloom on'}</button><button class="alt" id="quitBtn">Abort run</button></div></div>`;
  screen.classList.remove('hidden');
  wireSegs(screen, k => { if (k === 'cam') { camMode = SETTINGS.cam === 'scope' ? 'scope' : 'chase'; applyCam(); } });
  $('resBtn').addEventListener('click', togglePause);
  $('gfxBtn').addEventListener('click', () => { Q.bloom = !Q.bloom; if (Q.bloom && !composer) setupBloom(); showPause(); });
  $('quitBtn').addEventListener('click', () => { state = 'play'; endRun('quit'); });
}
function endRun(reason) {
  state = 'end'; quiet(); commsReset(); document.body.classList.remove('ingame'); rotPaused = false;
  G.end = reason;

  const aborted = reason !== 'done';
  if (!aborted) unlockCase(LV.id + 1);
  const next = !aborted && LEVELS[LV.id];
  const migrated = G.stones.filter(s => s.how === 'migrated').length;
  const stoneFree = !aborted && G.residual === 0 && migrated === 0;

  const how = st => st.how === 'dusted' ? 'Dusted' : st.how === 'fragmented' ? 'Fragmented' : st.how === 'basketed' ? 'Basketed whole' : st.how === 'migrated' ? '<span class="bd">Migrated to kidney</span>' : '<span class="wn">Not treated</span>';
  const cards = G.stones.map(st => {
    const T = TYPES[st.type];
    const conf = st.specimens ? `<span class="ok">confirmed by specimen ✓ (${st.specimens})</span>` : '<span class="wn">unconfirmed — no specimen sent</span>';
    return `<div class="sc"><div class="h"><span>Stone ${st.i + 1} · ${st.d0} mm · ${st.hu.toLocaleString()} HU — ${T.name}${T.alt ? ' (' + T.alt + ')' : ''}</span><span>${how(st)}</span></div>
      <div class="keys">${st.loc} · ${conf} · ${st.pulses} frag pulses · ${st.dustT.toFixed(1)} s dusting · looks ${T.look}</div>
      <p>${T.pearl}</p></div>`;
  }).join('');
  screen.innerHTML = `<div class="panel">
    <h1 style="font-size:24px">${head[0]}</h1><p>${head[1]}</p>
    <div class="quote"><div class="face">${faceSVG('att')}</div><p><b style="color:#60a5fa;font-size:11px;letter-spacing:.12em">DR. HAWKE</b><br>${attQuote(reason, stoneFree)}</p></div>
    <p class="keys">${LV.tag} · ${LV.name}${next && next.id === unlocked && !G.wasUnlocked ? ` — <b class="ok">${next.tag} unlocked: ${next.name}</b>` : ''}</p>
    <div class="stats">
      <div class="stat"><small>SCORE</small><b>${sc.toLocaleString()}</b></div>
      <div class="stat"><small>OR TIME</small><b>${fmtT(G.t)}</b></div>
      <div class="stat"><small>BASKET TRIPS</small><b>${G.trips}${G.trips ? ` · ${Math.round(G.tripTime)} s` : ''}</b></div>
      <div class="stat"><small>CLEAN PINCH PASSES</small><b>${G.cleanPasses}/${PINCHES.filter(livePinch).length}</b></div>
      <div class="stat"><small>PEDAL SWITCHES · REPROGRAMS</small><b>${G.pedSwitches} · ${G.reprograms}</b></div>
      <div class="stat"><small>RESIDUAL ≥2 MM</small><b>${G.residual}</b></div>
      <div class="stat"><small>PEAK IRP</small><b class="${G.peakP > 40 ? 'bd' : G.peakP > 30 ? 'wn' : 'ok'}">${Math.round(G.peakP)}</b></div>
      <div class="stat"><small>TIME &gt;40 MMHG</small><b>${G.timeOver40.toFixed(1)} s</b></div>
      <div class="stat"><small>MIN INTEGRITY</small><b>${Math.max(0, Math.round(G.minHp))}%</b></div>
    </div>
    <h2>PRE-OP</h2>${prepCard()}
    <h2>URETER</h2>${injuryCard(reason)}
    <h2>STONE ANALYSIS</h2>${cards}
    <h2>FEEDBACK</h2>
    <div class="fb"><textarea id="fbNotes" placeholder="What felt off, confusing or fun? (optional) — then share or copy the report and text it over"></textarea>
      <div class="go">${navigator.share ? '<button id="shareBtn">SHARE REPORT</button>' : ''}<button class="alt" id="copyBtn">Copy report</button><span id="fbMsg" class="keys"></span></div>
      <textarea id="fbOut" class="hidden" readonly></textarea></div>
    <div class="go">${next ? `<button id="nextBtn">${next.tag} ▸</button>` : ''}<button id="againBtn"${next ? ' class="alt"' : ''}>NEW STONES ▸</button><button class="alt" id="sameBtn">Same stones</button>${EMBED ? '<button class="alt" id="exitBtn">Back to Arcade</button>' : ''}</div>
  </div>`;
  if (EMBED) {
    // one claim per run; the app clamps it again (150 coins / 80 xp)
    toApp({ type: 'squadron:claim', coins: aborted ? 5 : Math.min(150, 20 + Math.round(sc / 25)), xp: aborted ? 2 : stoneFree ? 60 : 30 });
    $('exitBtn').addEventListener('click', () => toApp({ type: 'squadron:exit' }));
  }

  $('copyBtn').addEventListener('click', copyReport);
  if ($('shareBtn')) $('shareBtn').addEventListener('click', shareReport);
  screen.classList.remove('hidden');
  $('hud').classList.add('hidden'); $('touch').classList.add('hidden'); closeLaserPanel();
  $('againBtn').addEventListener('click', () => { newRun((Math.random() * 1e9) | 0, false); showBrief(); });
  $('sameBtn').addEventListener('click', () => { newRun(G.seed, G.fixed); showBrief(); });
  if (next) $('nextBtn').addEventListener('click', () => { newRun((Math.random() * 1e9) | 0, false, next); showBrief(); });
}

// ───────────────────────── tester run report (share sheet / clipboard — no backend)
function runReport() {
  const ua = (navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows|Linux/) || ['?'])[0];
  const inj = G.injury, g = pulsGrade(G.end), e = G.endInfo || { head: G.end || '?', sc: score() };
  const notes = (($('fbNotes') && $('fbNotes').value) || '').trim() || '—';
  return [
    `Stone Squadron 3D — run report · build ${BUILD}`,
    `Device: ${PHONE ? 'phone' : useTouch ? 'tablet' : 'desktop'} (${ua}) · ${innerWidth}×${innerHeight}`,
    `Settings: deflection ${SETTINGS.invert ? 'inverted' : 'standard'} · ${camMode === 'scope' ? 'scope view' : 'chase cam'} · laser ${SETTINGS.level}`,
    `Run: ${LV.tag} (${LV.name}) · ${G.fixed ? 'starter stones' : 'seed ' + G.seed} · ${e.head} · score ${e.sc} · OR time ${fmtT(G.t)}`,
    `Stones: ${G.stones.map(st => `${st.i + 1}) ${TYPES[st.type].name} ${st.d0} mm ${st.hu} HU → ${st.how || 'not treated'}${st.specimens ? ` (specimen ×${st.specimens})` : ''}`).join(' · ')}`,
    `Prep: antibiotic ${G.prep.abx || 'none'} (${abxVerdict()[0]}) · CT targets ${G.prep.found.size}/${G.stones.length} · phleboliths checked ${G.prep.phleb.size}`,
    `Residual ≥2 mm ${G.residual} · basket trips ${G.trips} (${Math.round(G.tripTime)} s) · pedal switches ${G.pedSwitches} · reprograms ${G.reprograms} · slipped fragments ${G.slips}`,
    `Peak IRP ${Math.round(G.peakP)} mmHg · ${G.timeOver40.toFixed(1)} s over 40 · lowest integrity ${Math.max(0, Math.round(G.minHp))}% · PULS ${g[0]} (${inj.burn} burns, ${inj.thermal} thermal, ${inj.scrape} abrasions)`,
    `Notes: ${notes}`,
  ].join('\n');
}
function fbSay(t) { const m = $('fbMsg'); if (m) m.textContent = t; }
async function copyReport() {
  const text = runReport();
  try { await navigator.clipboard.writeText(text); fbSay('Copied — paste it in a text'); return; } catch (_) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
  if (ok) { fbSay('Copied — paste it in a text'); return; }
  const box = $('fbOut'); box.value = text; box.classList.remove('hidden'); box.focus(); box.select(); fbSay('Select all + copy from the box below');
}
async function shareReport() {
  try { await navigator.share({ title: 'Stone Squadron 3D run report', text: runReport() }); fbSay('Shared — thanks!'); }
  catch (err) { if (!err || err.name !== 'AbortError') copyReport(); }
}

// ───────────────────────── bloom (optional; falls back to plain render)
let composer = null, bloomPass = null;
async function setupBloom() {
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js')]);
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.75, 0.45, 1.0);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
    resize();
  } catch (e) { composer = null; Q.bloom = false; console.warn('bloom unavailable', e); }
}

// ───────────────────────── loop
const useTouch = params.has('touch') || ('ontouchstart' in window) || matchMedia('(pointer: coarse)').matches;
function updateScale() { const v = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); dustPS.mat.uniforms.uScale.value = v; bloodPS.mat.uniforms.uScale.value = v; }
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Q.pr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(Q.pr); composer.setSize(w, h); }
  updateScale();
}
addEventListener('resize', resize);
let fpsFrames = 0, fpsTime = 0, fpsShown = 0, fpsWin = 0, fpsSlow = 0;
function fpsReset() { fpsFrames = 0; fpsTime = 0; fpsWin = 0; fpsSlow = 0; }
let last = performance.now(), tAll = 0;
function frame(now) {

  UNI.time.value = tAll;
  if (state === 'play') { update(dt); if (state === 'play') { chatter(); commsTick(dt); } }
  if (state === 'brief') attract(dt, tAll);
  else if (G && state !== 'brief') { if (state === 'play') { updateScene(dt); updateHUD(); } }
  if (Q.bloom && composer) composer.render(); else renderer.render(scene, camera);
  // auto quality: drop resolution + bloom if the device can't hold ~42 fps
  if (state === 'play') {
    fpsFrames++; fpsTime += raw;
    if (fpsTime > 3) {
      fpsShown = fpsFrames / fpsTime; fpsWin++;
      fpsSlow = fpsWin > 1 && fpsShown < 40 ? fpsSlow + 1 : 0;
      if (fpsSlow >= 2 && !Q.dropped) { Q.dropped = true; Q.pr = 1; Q.bloom = false; resize(); toast('Low-power graphics on', '', 'lq', 0); }
      fpsFrames = 0; fpsTime = 0;
    }
    if (DEBUG) setT(HUD.fps, `${fpsShown.toFixed(0)} fps · s ${G.p.s.toFixed(1)} · frags ${G.frags.length} · dust ${G.dust.toFixed(0)} · P ${G.P.toFixed(0)}`);
  }
}
if (DEBUG) HUD.fps.classList.remove('hidden');
resize();
const bootCase = clamp((+params.get('case') || 1) | 0, 1, LEVELS.length);
if (params.has('case')) unlockCase(bootCase); // direct link (tests, demos) opens that case
newRun(params.has('seed') ? +params.get('seed') : 1, !params.has('seed'), LEVELS[bootCase - 1]);

if (Q.bloom) setupBloom();
requestAnimationFrame(frame);
window.__sqBooted = true;
// test hook (headless checks): read state, drive input, advance the sim without rAF
window.__sq = {
  get G() { return G; }, get state() { return state; }, input, keys, joy, Q,
  start: startPlay, get rotPaused() { return rotPaused; }, report: () => runReport(), BUILD, toggleMode, setMode, selectPedal, spawnFrag, get marks() { return marks.length; }, injure: (k, s, th, sz) => injure(k, s, th, sz, 0), basketPress, moveOn, toggleCam, requestSettings, nudgeLaser, engaged, pinchNear, laserNums, flPoint, openLaserPanel, findTarget, SETTINGS, PINCHES, scene, camera, LEVELS, get LV() { return LV; }, newRun, gateS, lumR, calyxAt, say, get comms() { return COMMS; },
  step(sec, dt = 1 / 60) { for (let t = 0; t < sec && state === 'play'; t += dt) { update(dt); if (state === 'play') { chatter(); commsTick(dt); } } if (state === 'play') { updateScene(dt); updateHUD(); } },
};
